name: Release server

on:
  push:
    tags:
      - 'later-server/v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to GHCR (leave unchecked to just test that the build works/how long it takes)'
        type: boolean
        default: false

jobs:
  build-binaries:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#later-server/}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "dist/later-server_${{ steps.version.outputs.version }}_linux_${{ matrix.goarch }}" \
            ./cmd/later-server

      - uses: actions/upload-artifact@v7
        with:
          name: later-server_linux_${{ matrix.goarch }}
          path: dist/later-server_*

  release-binaries:
    if: github.event_name == 'push'
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: later-server_linux_*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum later-server_v* > later-server_checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: "later-server ${{ needs.build-binaries.outputs.version }}"
          generate_release_notes: true
          files: dist/*

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # GITHUB_REF_NAME for a tag push is the tag itself, e.g.
            # "later-server/v0.1.0" -- strip the tag_prefix to get "v0.1.0",
            # matching the build-binaries job above.
            echo "version=${GITHUB_REF_NAME#later-server/}" >> "$GITHUB_OUTPUT"
          else
            # Manual test run, no tag involved.
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/later-server"
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ steps.version.outputs.version }}" # v0.1.0
            BARE="${VERSION#v}"                             # 0.1.0
            MINOR="${BARE%.*}"                               # 0.1
            {
              echo "tags<<EOF"
              echo "${IMAGE}:${BARE}"
              echo "${IMAGE}:${MINOR}"
              echo "${IMAGE}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            # Manual test run: one fixed, always-overwritten tag -- never
            # touches the real X.Y.Z/X.Y/latest tags a genuine release uses.
            echo "tags=${IMAGE}:dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
