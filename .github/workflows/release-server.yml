name: Release server

on:
  push:
    tags:
      - 'later-server/v*'

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#later-server/}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o dist/later-server ./cmd/later-server
          tar -C dist -czf "later-server_${{ steps.version.outputs.version }}_linux_${{ matrix.goarch }}.tar.gz" later-server

      - uses: actions/upload-artifact@v4
        with:
          name: later-server_linux_${{ matrix.goarch }}
          path: later-server_*.tar.gz

  release-binaries:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: later-server_linux_*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > later-server_checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: "later-server ${{ needs.build-binaries.outputs.version }}"
          generate_release_notes: true
          files: dist/*

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          # GITHUB_REF_NAME for a tag push is the tag itself, e.g.
          # "later-server/v0.1.0" -- strip the tag_prefix to get "v0.1.0",
          # matching the build-binaries job above.
          echo "version=${GITHUB_REF_NAME#later-server/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}" # v0.1.0
          BARE="${VERSION#v}"                             # 0.1.0
          MINOR="${BARE%.*}"                               # 0.1
          IMAGE="ghcr.io/${{ github.repository_owner }}/later-server"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${BARE}"
            echo "${IMAGE}:${MINOR}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
