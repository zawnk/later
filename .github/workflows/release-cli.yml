name: Release CLI

on:
  push:
    tags:
      - 'later/v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#later/}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "dist/later_${{ steps.version.outputs.version }}_linux_${{ matrix.goarch }}" \
            ./cmd/later

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: later_linux_${{ matrix.goarch }}
          path: dist/later_*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: later_linux_*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum later_v* > later_checksums.txt

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "later ${{ needs.build.outputs.version }}"
          generate_release_notes: true
          files: dist/*
