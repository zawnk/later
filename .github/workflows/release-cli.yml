name: Release CLI

on:
  push:
    tags:
      - 'later/v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#later/}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "dist/later_${{ steps.version.outputs.version }}_linux_${{ matrix.goarch }}" \
            ./cmd/later

      - uses: actions/upload-artifact@v7
        with:
          name: later_linux_${{ matrix.goarch }}
          path: dist/later_*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: later_linux_*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum later_v* > later_checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: "later ${{ needs.build.outputs.version }}"
          generate_release_notes: true
          files: dist/*
