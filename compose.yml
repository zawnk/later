services:
  later:
    image: ghcr.io/zawnk/later-server:0.3.1@sha256:e72e286fb434f67f39d6fe0da423324f34f328931a7208e1b1c737d41ad51e6b
    # build: .   # uncomment (and comment out `image:` above) for a local/dev build instead of the published image
    container_name: later
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - LATER_HTTP_LOG=0
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/later", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
