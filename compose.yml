services:
  later:
    image: ghcr.io/zawnk/later-server:0.3.0@sha256:0d50586aa743c9969ceb37ac41b99bc7fc1f5d5bdaa2efceca76c4bccbd9b5f8
    # build: .   # uncomment (and comment out `image:` above) for a local/dev build instead of the published image
    container_name: later
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - LATER_HTTP_LOG=0
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/later", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
