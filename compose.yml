services:
  later:
    image: ghcr.io/zawnk/later-server:0.1.0
    # build: .   # uncomment (and comment out `image:` above) for a local/dev build instead of the published image
    container_name: later
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - LATER_HTTP_LOG=0
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
